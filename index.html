<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO: Información para Google -->
  <title>Tuki Pixel | Portal Retro de Juegos Web</title>
  <meta name="description" content="Juega a los mejores juegos web e independientes en Tuki Pixel. Desarrollado por GirlforIA.">
  <meta name="keywords" content="tuki pixel, girlforia, juegos gratis, juegos web, html5, pixel art">

  <!-- Fuente Pixel Art de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Press Start 2P', monospace, sans-serif;
      background-color: #6b8cce; /* Azul lavanda inspirado en el fondo superior */
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Encabezado con estética retro */
    header {
      background-color: #5a73b5;
      padding: 40px 20px;
      text-align: center;
      border-bottom: 6px solid #485c96;
      box-shadow: 0 6px 0 #32436f;
    }

    .top-subtitle {
      font-size: 0.8rem;
      color: #f1f5f9;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 2.8rem;
      color: #ffffff;
      text-shadow: 4px 4px 0px #32436f;
      letter-spacing: 3px;
      line-height: 1.2;
    }

    /* Visor interactivo del juego */
    #viewer-container {
      display: none;
      max-width: 960px;
      margin: 30px auto;
      background: #8b68b3; /* Violeta inspirado en el suelo de la imagen */
      padding: 20px;
      border: 4px solid #ffffff;
      box-shadow: 8px 8px 0px #32436f;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .viewer-header h2 {
      margin: 0;
      font-size: 1rem;
      color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 550px;
      border: 4px solid #32436f;
      background: #000;
    }

    .btn-close {
      font-family: 'Press Start 2P', monospace;
      background-color: #ff4757;
      color: white;
      border: 3px solid #ffffff;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.7rem;
      box-shadow: 3px 3px 0px #32436f;
    }

    .btn-close:hover {
      background-color: #ff6b81;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #32436f;
    }

    /* Galería de Juegos */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
      flex: 1;
    }

    .grid-games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 30px;
    }

    /* Tarjetas de Juegos */
    .card-game {
      background: #8b68b3; /* Púrpura pastel */
      border: 4px solid #ffffff;
      box-shadow: 6px 6px 0px #32436f;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .card-game:hover {
      transform: translate(-4px, -4px);
      box-shadow: 10px 10px 0px #32436f;
      background: #9b78c3;
    }

    .card-game img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      border-bottom: 4px solid #ffffff;
    }

    .card-info {
      padding: 18px 12px;
      text-align: center;
    }

    .card-info h3 {
      margin: 0 0 15px 0;
      font-size: 0.85rem;
      color: #ffffff;
      line-height: 1.4;
    }

    .btn-play {
      font-family: 'Press Start 2P', monospace;
      background: #ffbe76;
      color: #32436f;
      border: 3px solid #ffffff;
      padding: 10px;
      cursor: pointer;
      font-size: 0.75rem;
      width: 100%;
      box-shadow: 3px 3px 0px #32436f;
    }

    .card-game:hover .btn-play {
      background: #f6e58d;
    }

    /* Pie de página (Footer) Legal + Firma */
    footer {
      background-color: #5a73b5;
      border-top: 6px solid #485c96;
      padding: 30px 20px;
      text-align: center;
      margin-top: 40px;
      font-size: 0.6rem;
      line-height: 1.8;
      color: #e2e8f0;
    }

    .legal-text {
      max-width: 800px;
      margin: 0 auto 15px auto;
      color: #d1d5db;
    }

    .credits {
      color: #ffbe76;
      font-size: 0.75rem;
      margin-top: 10px;
      text-shadow: 1px 1px 0px #32436f;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-subtitle">PIXEL PERFECT</div>
    <h1>TUKI PIXEL</h1>
  </header>

  <div class="container">

    <!-- Visor interactivo del juego -->
    <div id="viewer-container">
      <div class="viewer-header">
        <h2 id="game-title">JUGANDO</h2>
        <button class="btn-close" onclick="cerrarJuego()">[X] CERRAR</button>
      </div>
      <iframe id="game-frame" src="" allowfullscreen="true"></iframe>
    </div>

    <!-- Catálogo de Juegos -->
    <div class="grid-games">
      
      <!-- JUEGO 1 -->
      <div class="card-game" onclick="cargarJuego('https://tu-juego-1.netlify.app', 'Nombre del Juego 1')">
        <img src="images/juego1.png" alt="Juego 1" onerror="this.src='https://via.placeholder.com/300x180?text=Juego+1'">
        <div class="card-info">
          <h3>NOMBRE DEL JUEGO 1</h3>
          <button class="btn-play">▶ JUGAR</button>
        </div>
      </div>

    </div>

  </div>

  <!-- Pie de página con aviso legal y firma -->
  <footer>
    <div class="legal-text">
      © 2026 Tuki Pixel. Todos los derechos reservados.<br>
      Este sitio web aloja juegos independientes con fines de entretenimiento. Todos los recursos, marcas y nombres de juegos pertenecen a sus respectivos desarrolladores.
    </div>
    <div class="credits">
      Desarrollado por GirlforIA
    </div>
  </footer>

  <script>
    function cargarJuego(url, titulo) {
      document.getElementById('game-title').innerText = titulo.toUpperCase();
      document.getElementById('game-frame').src = url;
      document.getElementById('viewer-container').style.display = 'block';
      window.scrollTo({ top: document.getElementById('viewer-container').offsetTop - 20, behavior: 'smooth' });
    }

    function cerrarJuego() {
      document.getElementById('game-frame').src = '';
      document.getElementById('viewer-container').style.display = 'none';
    }
  </script>
</body>
</html>
</html>
